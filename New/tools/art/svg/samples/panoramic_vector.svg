<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740">
  <!-- Panoramic, vector cartoon sample. Light from the upper left; dark outline #1a0f08.
       Colours from the 2017 icon and sprites: skin #583818/#785828, scarf #f83808, guard #284878/#4888a8. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5a2c"/>
      <stop offset="0.55" stop-color="#65401c"/>
      <stop offset="1" stop-color="#432812"/>
    </linearGradient>
    <linearGradient id="skinBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e3a1a"/>
      <stop offset="1" stop-color="#3a220e"/>
    </linearGradient>
    <radialGradient id="face" cx="0.62" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#8e5e30"/>
      <stop offset="0.6" stop-color="#6a421e"/>
      <stop offset="1" stop-color="#4a2c12"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2f3c"/>
      <stop offset="0.5" stop-color="#121218"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#5a3816"/>
      <stop offset="1" stop-color="#b98348"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3a"/>
      <stop offset="0.6" stop-color="#f83808"/>
      <stop offset="1" stop-color="#a81c06"/>
    </linearGradient>
    <radialGradient id="guard" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#b4d6ea"/>
      <stop offset="0.35" stop-color="#4888a8"/>
      <stop offset="1" stop-color="#1c3a68"/>
    </radialGradient>
    <linearGradient id="hide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f2ea"/>
      <stop offset="1" stop-color="#bdb4a4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c58d4c"/>
      <stop offset="1" stop-color="#6e4518"/>
    </linearGradient>
    <clipPath id="skirtClip">
