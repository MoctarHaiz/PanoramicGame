; Chaka Zulu: settings you can change without touching the code.
; After editing, export the game again. Debug builds always use Google's test ad units.

[store]

; Shown in share messages and opened by "Rate the game".
play_url="https://play.google.com/store/apps/details?id=com.HaizStudio.ChakaZulu"
; Numeric Apple ID of the app (App Store Connect > App Information), once it exists.
app_store_id=""
privacy_policy_url="https://haizstudio.github.io/chaka-zulu/privacy-policy.html"

[rules]

; A fall into a pit costs a life and he springs back up to the vine (new), instead of ending the run
; at once, hearts or not (the 2017 rule). Off until approved.
falls_cost_life=false

[ads]

enabled=true
interstitial_every_game_overs=5
; Debug builds only: show Google's consent form as if the phone were in Europe (to test it).
debug_consent_eea=false
; Live AdMob ad units of the Chaka Zulu apps in the Haiz Studio AdMob account. Empty = no ads in
; release builds on that platform. The AdMob *app* ids are in Project Settings > Admob.
android_banner=""
android_interstitial=""
ios_banner=""
ios_interstitial=""

[remove_ads]

; Turn on once a non-consumable product with this id exists in Play Console and App Store Connect.
enabled=false
product_id="remove_ads"

[leaderboards]

; Turn on once the leaderboard exists in Play Games Services and Game Center.
enabled=false
android_games_project_id=""
android_leaderboard_id=""
ios_leaderboard_id="most_red_bobs"
